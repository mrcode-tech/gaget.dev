<rect x="90" y="245" width="250" height="110" rx="12" fill="#fff" stroke="#d0d5dd"/><text x="112" y="280" font-size="16" font-weight="700" fill="#172033">ANATOMY</text><text x="112" y="306" font-size="13" fill="#475467">Spacing · radius · size</text><path d="M340 300 H420 V265 H450" fill="none" stroke="#98a2b3" stroke-width="2" stroke-dasharray="5 5"/>
