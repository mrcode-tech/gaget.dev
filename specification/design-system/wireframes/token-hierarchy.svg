<text x="720" y="870" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Rule: Components never reference Root directly.</text><text x="720" y="902" text-anchor="middle" font-size="14" fill="#667085">Semantic aliases keep themes and brand mappings replaceable.</text>
