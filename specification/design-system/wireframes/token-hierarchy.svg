<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="100%" height="100%" fill="#f7f8fb"/><rect x="0" y="0" width="1440" height="76" fill="#ffffff" stroke="#e1e5ed"/><text x="48" y="47" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">gaget.dev / Design system</text><text x="1392" y="45" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="14" fill="#667085">SPECIFICATION · TOKEN HANDOFF</text><text x="64" y="138" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">Token architecture</text><text x="64" y="174" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667085">A traceable path from primitive values to production UI</text>
<g font-family="Inter,Arial,sans-serif">
