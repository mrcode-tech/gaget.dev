<rect class="panel" x="1052" y="116" width="512" height="300" rx="14"/>
<text class="head" x="1074" y="148">03 · Multi-calendar date picker</text><text class="muted" x="1074" y="171">Calendar headings, digits, direction follow settings</text>
<rect class="field" x="1074" y="188" width="468" height="40" rx="8"/><text class="body" x="1090" y="213">۱۴۰۵/۰۷/۲۷  ·  Persian Solar Hijri</text><text class="blueText" x="1510" y="213">⌄</text>
