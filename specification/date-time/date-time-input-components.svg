<g class="small" text-anchor="middle"><text x="90" y="329">Sun</text><text x="148" y="329">Mon</text><text x="206" y="329">Tue</text><text x="264" y="329">Wed</text><text x="322" y="329">Thu</text><text x="380" y="329">Fri</text><text x="438" y="329">Sat</text></g>
<g class="day" text-anchor="middle"><text x="90" y="352">27</text><text x="148" y="352">28</text><text x="206" y="352">29</text><text x="264" y="352">30</text><text x="322" y="352">1</text><text x="380" y="352">2</text><text x="438" y="352">3</text><text x="90" y="376">4</text><text x="148" y="376">5</text><text x="206" y="376">6</text><text x="264" y="376">7</text><text x="322" y="376">8</text><text x="380" y="376">9</text><text x="438" y="376">10</text></g>
<!-- row 1 card 2 -->
<rect class="panel" x="544" y="116" width="490" height="300" rx="14"/>
<text class="head" x="566" y="148">02 · Calendar system selector</text><text class="muted" x="566" y="171">Searchable, bounded, keyboard accessible</text>
<text class="label" x="568" y="204">Calendar system</text>
<rect class="field" x="566" y="216" width="446" height="42" rx="8"/><text class="body" x="582" y="242">⌕  Search calendars…</text>
<rect class="panel" x="566" y="268" width="446" height="130" rx="9"/>
<rect class="soft" x="575" y="277" width="428" height="30" rx="6"/><circle cx="592" cy="292" r="6" fill="none" stroke="#1677ff" stroke-width="2"/><circle cx="592" cy="292" r="3" class="blue"/><text class="body" x="610" y="297">Gregorian</text><text class="small" x="926" y="297">2026-10-19</text>
<circle cx="592" cy="326" r="6" fill="none" stroke="#94a3b8"/><text class="body" x="610" y="331">Persian Solar Hijri</text><text class="small" x="926" y="331">۱۴۰۵/۰۷/۲۷</text>
<circle cx="592" cy="360" r="6" fill="none" stroke="#94a3b8"/><text class="body" x="610" y="365">Islamic · Umm al-Qura</text><text class="small" x="926" y="365">۱۴۴۸/۰۴/۰۷</text>
<text class="small" x="568" y="408">List scrolls inside bounded popover when necessary.</text>
