<text class="body" x="1094" y="263">‹</text><text class="label" x="1280" y="263">مهر ۱۴۰۵</text><text class="body" x="1512" y="263">›</text>
<line class="line" x1="1090" y1="274" x2="1526" y2="274"/>
<g class="small" text-anchor="middle"><text x="1115" y="294">ش</text><text x="1173" y="294">ی</text><text x="1231" y="294">د</text><text x="1289" y="294">س</text><text x="1347" y="294">چ</text><text x="1405" y="294">پ</text><text x="1463" y="294">ج</text></g>
<g class="day" text-anchor="middle"><text x="1115" y="319">۱</text><text x="1173" y="319">۲</text><text x="1231" y="319">۳</text><text x="1289" y="319">۴</text><text x="1347" y="319">۵</text><text x="1405" y="319">۶</text><text x="1463" y="319">۷</text><text x="1115" y="344">۸</text><text x="1173" y="344">۹</text><text x="1231" y="344">۱۰</text><text x="1289" y="344">۱۱</text><text x="1347" y="344">۱۲</text><text x="1405" y="344">۱۳</text><text x="1463" y="344">۱۴</text></g>
<circle class="chosen" cx="1405" cy="369" r="13"/><text class="chosenText" x="1405" y="373" text-anchor="middle">۲۷</text><text class="small" x="1094" y="386">Calendar date stays date-only; no timezone shift.</text>
<!-- row 2 -->
<rect class="panel" x="36" y="436" width="490" height="300" rx="14"/>
<text class="head" x="58" y="468">04 · Time picker</text><text class="muted" x="58" y="491">Bounded columns, direct entry, 12/24-hour support</text>
<text class="label" x="60" y="524">Time</text><rect class="field" x="58" y="536" width="444" height="42" rx="8"/><text class="body" x="76" y="562">◷  14:30</text><text class="blueText" x="470" y="562">⌄</text>
<rect class="panel" x="58" y="588" width="444" height="130" rx="10"/>
<rect class="soft" x="74" y="600" width="412" height="32" rx="7"/><text class="blueText" x="280" y="621" text-anchor="middle">24-hour format</text>
<line class="line" x1="278" y1="640" x2="278" y2="704"/>
<text class="small" x="175" y="652" text-anchor="middle">Hour</text><text class="small" x="382" y="652" text-anchor="middle">Minute</text>
<text class="muted" x="175" y="676" text-anchor="middle">13</text><text class="muted" x="382" y="676" text-anchor="middle">29</text>
