<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">gaget.dev Date and Time reusable multi-calendar input components</title>
<desc id="desc">A design system wireframe gallery for styled date input, searchable calendar selector, Persian calendar picker, time picker, combined date-time picker, date range picker, timezone selector, input states and compact variants.</desc>
<defs>
 <style>
 .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe3ef;stroke-width:1.5}.field{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.muted{fill:#64748b;font:14px Arial,sans-serif}.label{fill:#334155;font:600 15px Arial,sans-serif}.title{fill:#0f172a;font:700 22px Arial,sans-serif}.head{fill:#0f172a;font:700 17px Arial,sans-serif}.body{fill:#334155;font:14px Arial,sans-serif}.small{fill:#64748b;font:12px Arial,sans-serif}.blue{fill:#1677ff}.blueText{fill:#1677ff;font:600 14px Arial,sans-serif}.btn{fill:#1677ff;stroke:#1677ff}.btnText{fill:white;font:600 13px Arial,sans-serif}.line{stroke:#e2e8f0;stroke-width:1}.day{fill:#334155;font:12px Arial,sans-serif}.chosen{fill:#1677ff}.chosenText{fill:#fff;font:600 12px Arial,sans-serif}.soft{fill:#eff6ff}
 </style>
</defs>
<rect class="bg" width="1600" height="1200"/>
<text x="36" y="44" class="title" style="font-size:28px">gaget.dev · Date &amp; Time Input System</text>
<text x="36" y="72" class="muted">Reusable shadcn-style components · multi-calendar · locale and digits separated · consistent states and responsive behavior</text>
<rect x="36" y="92" width="1528" height="1" fill="#cbd5e1"/>
<!-- row 1 card 1 -->
<rect class="panel" x="36" y="116" width="490" height="300" rx="14"/>
<text class="head" x="58" y="148">01 · Date input + calendar popover</text><text class="muted" x="58" y="171">Styled field, not a native browser date control</text>
<text class="label" x="60" y="204">Date</text>
<rect class="field" x="58" y="216" width="444" height="44" rx="8"/>
<text class="body" x="74" y="243">2026-10-19</text><text class="blueText" x="470" y="243">⌄</text>
<rect class="panel" x="58" y="272" width="444" height="126" rx="10"/>
