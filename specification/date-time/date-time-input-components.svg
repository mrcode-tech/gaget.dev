<!-- combined -->
<rect class="panel" x="544" y="436" width="490" height="300" rx="14"/>
<text class="head" x="566" y="468">05 · Combined date &amp; time picker</text><text class="muted" x="566" y="491">One field, separate sections inside a single popover</text>
<text class="label" x="568" y="524">Date &amp; time</text><rect class="field" x="566" y="536" width="446" height="42" rx="8"/><text class="body" x="584" y="562">▦  2026-10-19  14:30</text><text class="blueText" x="980" y="562">⌄</text>
<rect class="panel" x="566" y="588" width="446" height="130" rx="10"/>
<rect class="soft" x="578" y="598" width="422" height="30" rx="6"/><text class="blueText" x="685" y="618" text-anchor="middle">Date</text><text class="body" x="895" y="618" text-anchor="middle">Time</text>
<text class="label" x="592" y="649">October 2026</text><text class="small" x="592" y="670">Sun  Mon  Tue  Wed  Thu  Fri  Sat</text>
<text class="body" x="594" y="694">4    5    6    7    8    9   10</text><circle class="chosen" cx="730" cy="709" r="10"/><text class="chosenText" x="730" y="713" text-anchor="middle">19</text><text class="body" x="760" y="713">20  21  22  23  24</text>
<rect class="soft" x="842" y="640" width="146" height="60" rx="7"/><text class="blueText" x="915" y="664" text-anchor="middle">14 : 30</text><text class="small" x="915" y="686" text-anchor="middle">24-hour · zone aware</text>
<!-- timezone -->
<rect class="panel" x="1052" y="436" width="512" height="300" rx="14"/>
<text class="head" x="1074" y="468">06 · Time-zone selector</text><text class="muted" x="1074" y="491">Search IANA zones; show offset and city/region</text>
<text class="label" x="1076" y="524">Time zone</text><rect class="field" x="1074" y="536" width="468" height="42" rx="8"/><text class="body" x="1092" y="562">⌕  Search time zones…</text>
<rect class="panel" x="1074" y="588" width="468" height="130" rx="10"/>
<rect class="soft" x="1082" y="596" width="452" height="30" rx="6"/><text class="body" x="1098" y="616">◉  Asia/Tehran</text><text class="small" x="1462" y="616">UTC+03:30</text>
<text class="body" x="1098" y="650">○  Asia/Baku</text><text class="small" x="1462" y="650">UTC+04:00</text><text class="body" x="1098" y="684">○  Europe/London</text><text class="small" x="1462" y="684">UTC+01:00</text>
<!-- row 3 -->
<rect class="panel" x="36" y="756" width="490" height="286" rx="14"/>
<text class="head" x="58" y="788">07 · Date range picker</text><text class="muted" x="58" y="811">Linked endpoints; inclusive range clearly highlighted</text>
<text class="label" x="60" y="844">Start date</text><text class="label" x="286" y="844">End date</text><rect class="field" x="58" y="854" width="210" height="40" rx="8"/><rect class="field" x="282" y="854" width="220" height="40" rx="8"/><text class="body" x="72" y="879">2026-10-01</text><text class="body" x="296" y="879">2026-10-31</text>
<rect class="panel" x="58" y="906" width="444" height="116" rx="9"/><text class="label" x="80" y="931">October 2026</text><text class="small" x="80" y="954">Sun Mon Tue Wed Thu Fri Sat</text><rect class="soft" x="78" y="962" width="394" height="24" rx="5"/><text class="blueText" x="90" y="979">1   2   3   4   5   6   7   8   9   …   31</text><text class="small" x="80" y="1008">On desktop, show two months when space permits.</text>
<!-- states -->
<rect class="panel" x="544" y="756" width="490" height="286" rx="14"/>
<text class="head" x="566" y="788">08 · Shared input states</text><text class="muted" x="566" y="811">Same dimensions, radius, type, and icon alignment</text>
<text class="label" x="568" y="842">Default</text><rect class="field" x="566" y="850" width="446" height="34" rx="7"/><text class="body" x="580" y="872">▦  2026-10-19</text>
<text class="label" x="568" y="908">Focused</text><rect x="566" y="916" width="446" height="34" rx="7" fill="#fff" stroke="#1677ff" stroke-width="2"/><text class="body" x="580" y="938">▦  2026-10-19</text>
<text class="label" x="568" y="974">Error</text><rect x="566" y="982" width="446" height="34" rx="7" fill="#fff" stroke="#ef4444" stroke-width="1.5"/><text x="580" y="1004" fill="#b91c1c" font-family="Arial,sans-serif" font-size="13">Invalid date</text>
<!-- locale / compact -->
<rect class="panel" x="1052" y="756" width="512" height="286" rx="14"/>
<text class="head" x="1074" y="788">09 · Shared locale controls + compact fields</text><text class="muted" x="1074" y="811">Calendar, language, digits and zone are separate</text>
<text class="label" x="1076" y="842">Language / locale</text><rect class="field" x="1074" y="850" width="224" height="38" rx="7"/><text class="body" x="1088" y="874">English (en-US) ⌄</text>
<text class="label" x="1310" y="842">Digits</text><rect class="field" x="1308" y="850" width="234" height="38" rx="7"/><text class="body" x="1322" y="874">Locale default ⌄</text>
<text class="label" x="1076" y="914">Calendar</text><rect class="field" x="1074" y="922" width="224" height="38" rx="7"/><text class="body" x="1088" y="946">Persian Solar Hijri ⌄</text>
<text class="label" x="1310" y="914">Clock format</text><rect class="field" x="1308" y="922" width="234" height="38" rx="7"/><text class="body" x="1322" y="946">24-hour ⌄</text>
<text class="small" x="1076" y="986">Compact inline variant reuses the same component tokens</text><rect class="field" x="1074" y="996" width="468" height="34" rx="7"/><text class="body" x="1088" y="1018">▦  2026-10-19  ⌄</text>
<!-- footer -->
<rect x="36" y="1062" width="1528" height="100" rx="12" fill="#eef6ff" stroke="#bfdbfe"/>
<text class="head" x="58" y="1096">System-wide usage</text><text class="body" x="58" y="1122">Date Difference · Age Calculator · Date Calculator · Business Days · Countdown · Meeting Planner · Timestamp Converter · Calendar Generator</text>
<text class="body" x="58" y="1146">Required: shadcn-style primitives · keyboard navigation · focus restoration · bounded scrolling · date-only safety · DST-aware zone handling · RTL/LTR validation</text>
<text class="small" x="36" y="1185">Wireframe is structural guidance. Use existing gaget.dev design tokens and shared accessible components for final implementation.</text>
</svg>