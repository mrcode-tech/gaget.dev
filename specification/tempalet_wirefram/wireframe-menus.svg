<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#f8fafc"/><text x="28" y="42" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Menu anatomy — existing Photo Editor</text><text x="28" y="78" font-family="Arial" font-size="14" fill="#64748b">Icon + label + optional supporting description; aligned row starts and consistent hit targets.</text><rect x="28" y="108" width="420" height="610" rx="12" fill="#fff" stroke="#94a3b8"/><text x="48" y="140" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Features (compact)</text><g font-family="Arial" fill="#0f172a"><rect x="42" y="156" width="392" height="58" rx="7" fill="#eff6ff"/><text x="58" y="180" font-size="16">⌗  Crop</text><text x="84" y="199" font-size="11" fill="#64748b">Select and apply a crop region</text><rect x="42" y="218" width="392" height="58" rx="7" fill="#fff"/><text x="58" y="242" font-size="16">↔  Resize</text><text x="84" y="261" font-size="11" fill="#64748b">Change output dimensions</text><rect x="42" y="280" width="392" height="58" rx="7" fill="#fff"/><text x="58" y="304" font-size="16">T  Text &amp; watermark</text><text x="84" y="323" font-size="11" fill="#64748b">Add and style text overlays</text><path d="M48 352H428" stroke="#cbd5e1"/><text x="52" y="376" font-size="11" fill="#64748b">IMAGE</text><text x="58" y="407" font-size="15">☼  Color &amp; filters</text><text x="58" y="449" font-size="15">◉  Color picker</text><text x="58" y="491" font-size="15">ⓘ  Image details</text><text x="58" y="533" font-size="15">⇩  Export &amp; convert</text><text x="58" y="575" font-size="15">▤  Print size</text><text x="58" y="617" font-size="15">{ }  Image/Base64 workflows</text><path d="M48 638H428" stroke="#cbd5e1"/><text x="52" y="664" font-size="11" fill="#64748b">CREATE</text><text x="58" y="691" font-size="15">▦  Favicon · Collage · SVG optimize</text></g><rect x="478" y="108" width="494" height=