<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f8fafc"/><text x="30" y="44" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Component detail sheet — spacing and interaction anatomy</text><rect x="30" y="68" width="700" height="800" rx="12" fill="#fff" stroke="#94a3b8"/><text x="54" y="102" font-family="Arial" font-size="12" fill="#64748b">EDITOR BAR ABOVE SHARED WORKSPACE</text><rect x="50" y="116" width="660" height="48" rx="8" fill="#fff" stroke="#64748b"/><text x="70" y="146" font-family="Arial" font-size="14" fill="#0f172a">File</text><text x="630" y="146" font-family="Arial" font-size="14" fill="#0f172a">Features</text><text x="54" y="198" font-family="Arial" font-size="12" fill="#64748b">12px XS gutter / 24px from SM; intro remains in workspace scroll region</text><text x="54" y="230" font-family="Arial" font-size="12" fill="#64748b">Home › Photo Editor</text><text x="54" y="268" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Photo Editor</text><text x="54" y="297" font-family="Arial" font-size="14" fill="#64748b">Edit, crop, resize, and enhance images in your browser.</text><path d="M54 313H710" stroke="#cbd5e1" stroke-dasharray="5 5"/><text x="54" y="335" font-family="Arial" font-size="11" fill="#64748b">2rem deliberate gap before upload target</text><rect x="140" y="358" width="480" height="390" rx="18" fill="#fff" stroke="#94a3b8" stroke-dasharray="7 5"/><rect x="336" y="406" width="88" height="78" rx="14" fill="#dbeafe"/><text x="366" y="454" font-family="Arial" font-size="26" fill="#1d4ed8">▧</text><text x="220" y="520" font-family="Arial" font-size="17" font-weight="700" fill="#0f172a">Drag and drop an image here</text><text x="370" y="547" font-family="Arial" font-size="13" fill="#64748b">or</text><rect x="300" y="565" width="160" height="42" rx="8" fill="#2563eb"/><text x="342" y="591" font-family="Arial" font-size="14" fill="#fff">Choose photo</text><text x="180" y="638" font-family="Arial" font-size="12" fill="#64748b">480px max width · 280px min height · 400px max height</text><text x="54" y="784" font-family="Arial" font-size="12" fill="#64748b">Empty state has one vertical scroll path for intro + target.</text><text x="54" y="808" font-family="Arial" font-size="12" fill="#64748b">Short viewport starts at top; no clipped centered card.</text><text x="54" y="832" font-family="Arial" font-size="12" fill="#64748b">Loaded state removes intro; canvas can scroll in both axes when zoomed.</text><rect x="760" y="68" width="410" height="800" rx="12" fill="#fff" stroke="#94a3b8"/><text x="784" y="102" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Loaded utility controls</text><rect x="782" y="120" width="366" height="40" rx="7" fill="#f1f5f9"/><text x="796" y="145" font-family="Arial" font-size="12" fill="#334155">filename.jpg · 1920 × 1080 px</text><rect x="782" y="172" width="366" height="48" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="796" y="201" font-family="Arial" font-size="13" fill="#334155">↶ Undo  ↷ Redo  −  Fit  +  Export</text><text x="784" y="254" font-family="Arial" font-size="13" font-weight="700" fill="#0f172a">Feature input example</text><text x="784" y="282" font-family="Arial" font-size="12" fill="#334155">Brightness</text><path d="M784 302H1146" stroke="#94a3b8" stroke-width="4"/><circle cx="970" cy="302" r="8" fill="#2563eb"/><text x="784" y="338" font-family="Arial" font-size="12" fill="#334155">Width</text><rect x="784" y="350" width="164" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="800" y="375" font-family="Arial" font-size="13" fill="#334155">1920 px</text><text x="970" y="338" font-family="Arial" font-size="12" fill="#334155">Height</text><rect x="970" y="350" width="176" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="986" y="375" font-family="Arial" font-size="13" fill="#334155">1080 px</text><rect x="784" y="414" width="362" height="42" rx="7" fill="#2563eb"/><text x="907" y="440" font-family="Arial" font-size="14" fill="#fff">Apply / Export</text><path d="M784 484H1146" stroke="#cbd5e1"/><text x="784" y="514" font-family="Arial" font-size="13" font-weight="700" fill="#0f172a">Required behavior</text><g font-family="Arial" font-size="12" fill="#334155"><text x="784" y="542">• Visible focus and accessible names</text><text x="784" y="570">• Labels near fields, consistent spacing</text><text x="784" y="598">• Disabled history states reflect real history</text><text x="784" y="626">• Zoomed canvas remains reachable both axes</text><text x="784" y="654">• Panel controls scroll inside the panel</text><text x="784" y="682">• No horizontal page overflow</text><text x="784" y="710">• Errors/success shown inline</text><text x="784" y="738">• Reuse existing theme tokens and icons</text></g></svg>