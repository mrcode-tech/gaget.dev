<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">GaGet.dev MCP contextual help panel — Proposal</title>
  <desc id="desc">Target wireframe for a tool workspace and MCP help panel with capability status, privacy mode, task prompt, operation chain, and setup guidance.</desc>
  <rect width="1200" height="900" fill="#f4f5f7"/>
  <text x="48" y="42" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">GaGet.dev · Target concept · PROPOSAL — not current-state evidence</text>
  <rect x="40" y="66" width="1120" height="790" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="66" width="1120" height="64" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="72" y="105" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Encoding &amp; Decoding</text>
  <rect x="928" y="82" width="196" height="34" rx="8" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="1026" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#075985">AI / MCP help</text>
  <rect x="68" y="160" width="500" height="650" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="94" y="199" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Existing tool workspace</text>
  <text x="94" y="234" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Normal browser tool remains independent.</text>
  <rect x="94" y="260" width="448" height="188" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="292" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Input / file area</text>
  <rect x="94" y="466" width="214" height="44" rx="8" fill="#e5e7eb"/>
  <text x="201" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">Run locally</text>
  <rect x="326" y="466" width="216" height="44" rx="8" fill="#e5e7eb"/>
  <text x="434" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">Download result</text>
  <rect x="94" y="530" width="448" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="562" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Existing result / preview</text>
  <rect x="590" y="160" width="542" height="650" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="620" y="199" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">Use this tool with an AI assistant</text>
  <text x="620" y="230" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">MCP compatibility · contextual guidance</text>
  <rect x="620" y="252" width="482" height="74" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="640" y="279" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">Status: Partial / verified subset</text>
  <text x="640" y="303" font-family="Arial, sans-serif" font-size="14" fill="#166534">Server mode · limits and supported formats</text>
  <text x="620" y="362" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Example request</text>
  <rect x="620" y="378" width="482" height="82" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="640" y="409" font-family="Arial, sans-serif" font-size="15" fill="#374151">“Decode this Base64 text, validate it as</text>
  <text x="640" y="433" font-family="Arial, sans-serif" font-size="15" fill="#374151">JSON, then format the result.”</text>
  <text x="620" y="496" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Operation chain</text>
  <rect x="620" y="512" width="482" height="92" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="640" y="541" font-family="Arial, sans-serif" font-size="15" fill="#374151">1. encoding.base64.decode</text>
  <text x="640" y="565" font-family="Arial, sans-serif" font-size="15" fill="#374151">2. json.validate</text>
  <text x="640" y="589" font-family="Arial, sans-serif" font-size="15" fill="#374151">3. json.format</text>
  <text x="620" y="640" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Privacy and setup</text>
  <text x="620" y="666" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">State whether files are sent to a server.</text>
  <text x="620" y="689" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Show limits, setup and known gaps.</text>
  <rect x="620" y="716" width="222" height="42" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="731" y="742" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">Copy setup guidance</text>
  <rect x="854" y="716" width="248" height="42" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="978" y="742" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">Open full MCP docs</text>
</svg>
