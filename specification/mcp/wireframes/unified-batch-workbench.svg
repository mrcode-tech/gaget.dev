<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="1500" height="980" fill="#f5f6f8"/><rect width="1500" height="58" fill="#fff" stroke="#cbd5e1"/>
<text x="24" y="36" font-family="Arial" font-size="20" font-weight="bold" fill="#172033">GaGet.dev</text><text x="190" y="36" font-family="Arial" font-size="14" fill="#475569">Home</text><text x="260" y="36" font-family="Arial" font-size="14" fill="#172033">Dev Tools</text><text x="360" y="36" font-family="Arial" font-size="14" font-weight="bold" fill="#2563eb">Batch Workbench</text><text x="535" y="36" font-family="Arial" font-size="14" fill="#475569">MCP &amp; Integrations</text>
<rect x="20" y="78" width="1460" height="78" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="42" y="110" font-family="Arial" font-size="23" font-weight="bold" fill="#172033">Batch Workbench</text><text x="42" y="136" font-family="Arial" font-size="14" fill="#475569">Compose typed operations from text, files, images, audio, video, JSON and date/time.</text><rect x="1280" y="98" width="82" height="38" rx="7" fill="#2563eb"/><text x="1321" y="122" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Run</text><rect x="1372" y="98" width="88" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1416" y="122" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Cancel</text>
<rect x="20" y="176" width="300" height="780" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="40" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#172033">1. Input</text><text x="40" y="238" font-family="Arial" font-size="13" fill="#64748b">Choose input type</text><rect x="40" y="250" width="260" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="54" y="275" font-family="Arial" font-size="14" fill="#334155">Image ▾</text><text x="40" y="322" font-family="Arial" font-size="13" font-weight="bold" fill="#334155">Source file</text><rect x="40" y="334" width="260" height="112" rx="8" fill="#fbfdff" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="170" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Drop image here</text><text x="170" y="402" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748b">or choose a file</text><rect x="95" y="411" width="150" height="25" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="170" y="428" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Choose image</text><rect x="40" y="464" width="260" height="82" rx="7" fill="#f8fafc" stroke="#e2e8f0"/><text x="54" y="488" font-family="Arial" font-size="13" font-weight="bold" fill="#334155">photo.png</text><text x="54" y="510" font-family="Arial" font-size="12" fill="#64748b">PNG · 2.4 MB</text><text x="54" y="530" font-family="Arial" font-size="12" fill="#64748b">2400 × 1600 px</text><text x="40" y="580" font-family="Arial" font-size="13" font-weight="bold" fill="#334155">Execution mode</text><rect x="40" y="592" width="260" height="65" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="54" y="616" font-family="Arial" font-size="13" font-weight="bold" fill="#1d4ed8">Browser-local</text><text x="54" y="638" font-family="Arial" font-size="12" fill="#334155">No upload for this local run.</text><text x="40" y="696" font-family="Arial" font-size="12" fill="#64748b">Accepted formats and hard limits</text><text x="40" y="715" font-family="Arial" font-size="12" fill="#64748b">shown before processing.</text>
<rect x="340" y="176" width="660" height="780" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="362" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#172033">2. Pipeline</text><text x="362" y="236" font-family="Arial" font-size="13" fill="#64748b">Search by task, operation, type or category</text><rect x="362" y="250" width="616" height="42" rx="7" fill="#fff" stroke="#94a3b8"/><text x="378" y="276" font-family="Arial" font-size="13" fill="#64748b">Search operations: crop, resize, Base64…</text><text x="362" y="315" font-family="Arial" font-size="12" fill="#64748b">Compatible with image input · runtime status shown per operation</text>
<rect x="362" y="332" width="616" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="382" y="359" font-family="Arial" font-size="15" font-weight="bold" fill="#172033">1  Crop image</text><text x="958" y="359" text-anchor="end" font-family="Arial" font-size="12" fill="#64748b">image → image</text><text x="382" y="388" font-family="Arial" font-size="13" fill="#475569">x: 0 · y: 0 · width: 800 · height: 600</text><rect x="382" y="402" width="576" height="30" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="394" y="422" font-family="Arial" font-size="12" fill="#64748b">Configure crop…</text><text x="382" y="459" font-family="Arial" font-size="12" fill="#64748b">Browser-local · Move up/down · Duplicate · Remove</text>
<rect x="362" y="496" width="616" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="382" y="523" font-family="Arial" font-size="15" font-weight="bold" fill="#172033">2  Resize image</text><text x="958" y="523" text-anchor="end" font-family="Arial" font-size="12" fill="#64748b">image → image</text><text x="382" y="552" font-family="Arial" font-size="13" fill="#475569">Width: 1200 · Height: 900 · Fit: contain</text><rect x="382" y="566" width="576" height="30" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="394" y="586" font-family="Arial" font-size="12" fill="#64748b">Configure resize…</text><text x="382" y="623" font-family="Arial" font-size="12" fill="#64748b">Output: image · limits checked before execution</text>
<rect x="362" y="660" width="616" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="382" y="687" font-family="Arial" font-size="15" font-weight="bold" fill="#172033">3  Encode image bytes as Base64</text><text x="958" y="687" text-anchor="end" font-family="Arial" font-size="12" fill="#64748b">image bytes → text</text><text x="382" y="716" font-family="Arial" font-size="13" fill="#475569">Explicit conversion · size preflight</text><rect x="382" y="730" width="576" height="30" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="394" y="750" font-family="Arial" font-size="12" fill="#64748b">Configure encoding…</text><text x="382" y="787" font-family="Arial" font-size="12" fill="#64748b">Illustrative target chain, not proof of MCP support.</text><text x="362" y="852" font-family="Arial" font-size="13" fill="#2563eb">+ Add operation</text><text x="362" y="882" font-family="Arial" font-size="12" fill="#64748b">Whole-chain validation blocks incompatible steps.</text>
<rect x="1020" y="176" width="460" height="780" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="1042" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#172033">3. Result</text><text x="1042" y="236" font-family="Arial" font-size="13" fill="#64748b">Viewer follows the actual output type</text><rect x="1042" y="250" width="416" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="1056" y="276" font-family="Arial" font-size="14" font-weight="bold" fill="#334155">Text output · text/plain</text><rect x="1042" y="310" width="416" height="280" rx="7" fill="#0f172a"/><text x="1060" y="343" font-family="monospace" font-size="12" fill="#e2e8f0">iVBORw0KGgoAAAANSUhEUgAA...</text><text x="1060" y="369" font-family="monospace" font-size="12" fill="#e2e8f0">...bounded Base64 preview...</text><text x="1060" y="564" font-family="Arial" font-size="12" fill="#94a3b8">Preview is truncated for display.</text><rect x="1042" y="606" width="120" height="38" rx="6" fill="#2563eb"/><text x="1102" y="630" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Copy text</text><rect x="1172" y="606" width="130" height="38" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1237" y="630" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Download</text><rect x="1312" y="606" width="146" height="38" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1385" y="630" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Use next step</text><rect x="1042" y="670" width="416" height="100" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="1058" y="696" font-family="Arial" font-size="13" font-weight="bold" fill="#334155">Run summary</text><text x="1058" y="721" font-family="Arial" font-size="12" fill="#64748b">3 sequential steps · typed output</text><text x="1058" y="744" font-family="Arial" font-size="12" fill="#64748b">Runtime and privacy disclosed per step</text><rect x="1042" y="790" width="416" height="70" rx="7" fill="#fff7ed" stroke="#fed7aa"/><text x="1058" y="816" font-family="Arial" font-size="13" font-weight="bold" fill="#9a3412">Design proposal</text><text x="1058" y="838" font-family="Arial" font-size="12" fill="#7c2d12">Not a current-state screenshot or support claim.</text><text x="20" y="974" font-family="Arial" font-size="11" fill="#64748b">Target desktop wireframe; responsive states are specified in workflow-ux-architecture.md</text>
</svg>