<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">GaGet.dev JSON workspace layout proposal</title>
  <desc id="desc">Conceptual desktop and mobile layouts showing File and Features menus, a line-numbered JSON source editor, output, and diagnostics.</desc>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="40" y="42" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">JSON Workspace — Proposal</text>
  <text x="40" y="68" fill="#475569" font-family="Arial, sans-serif" font-size="13">Target anatomy only; browser screenshots remain build-specific evidence.</text>
  <rect x="38" y="92" width="790" height="530" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="38" y="92" width="790" height="52" rx="14" fill="#f1f5f9"/>
  <rect x="38" y="130" width="790" height="14" fill="#f1f5f9"/>
  <text x="60" y="124" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700">GaGet.dev</text>
  <rect x="144" y="105" width="74" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="181" y="123" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">File</text>
  <rect x="226" y="105" width="100" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="276" y="123" fill="#1e3a8a" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700">Features</text>
  <text x="60" y="176" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">JSON Formatter &amp; Validator</text>
  <text x="60" y="198" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Format, inspect, validate and compare structured data.</text>
  <rect x="58" y="218" width="360" height="278" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="58" y="218" width="360" height="36" rx="8" fill="#f8fafc"/>
  <rect x="58" y="246" width="360" height="8" fill="#f8fafc"/>
  <text x="74" y="241" fill="#334155" font-family="Arial, sans-serif" font-size="12" font-weight="700">Input JSON</text>
  <rect x="59" y="255" width="38" height="240" fill="#f1f5f9"/>
  <path d="M98 255V495" stroke="#cbd5e1"/>
  <g fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">
    <text x="88" y="278">1</text><text x="88" y="302">2</text><text x="88" y="326">3</text><text x="88" y="350">4</text><text x="88" y="374">5</text><text x="88" y="398">6</text>
  </g>
  <g fill="#334155" font-family="monospace" font-size="12">
    <text x="112" y="278">{</text><text x="112" y="302">"name": "GaGet.dev",</text><text x="112" y="326">"version": 1,</text><text x="112" y="350">"ready": true</text><text x="112" y="374">}</text>
  </g>
  <rect x="434" y="218" width="374" height="278" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="434" y="218" width="374" height="36" rx="8" fill="#f8fafc"/>
  <rect x="434" y="246" width="374" height="8" fill="#f8fafc"/>
  <text x="450" y="241" fill="#334155" font-family="Arial, sans-serif" font-size="12" font-weight="700">Output / Tree / Comparison</text>
  <rect x="450" y="270" width="342" height="205" rx="5" fill="#f8fafc"/>
  <g fill="#334155" font-family="monospace" font-size="12">
    <text x="466" y="296">{</text><text x="482" y="320">"name": "GaGet.dev",</text><text x="482" y="344">"version": 1,</text><text x="482" y="368">"ready": true</text><text x="466" y="392">}</text>
  </g>
  <rect x="58" y="510" width="750" height="88" rx="8" fill="#fff7f7" stroke="#fecaca"/>
  <circle cx="78" cy="534" r="6" fill="#b91c1c"/>
  <text x="92" y="538" fill="#991b1b" font-family="Arial, sans-serif" font-size="12" font-weight="700">Validation diagnostics</text>
  <text x="76" y="562" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="12">Line 4, column 13 — concise explanation with keyboard-accessible navigation to source.</text>
  <text x="76" y="583" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="11">Edits clear stale diagnostics; source positions are derived from the parser, not guessed.</text>
  <rect x="858" y="92" width="304" height="530" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="872" y="108" width="276" height="46" rx="9" fill="#f1f5f9"/>
  <text x="884" y="136" fill="#0f172a" font-family="Arial, sans-serif" font-size="12" font-weight="700">☰</text>
  <rect x="904" y="117" width="54" height="27" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="931" y="134" fill="#0f172a" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">File</text>
  <rect x="1027" y="117" width="108" height="27" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1081" y="134" fill="#1e3a8a" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700">Features</text>
  <text x="884" y="178" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700">JSON workspace</text>
  <text x="884" y="197" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Source remains LTR in RTL locales.</text>
  <rect x="884" y="210" width="248" height="200" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="884" y="210" width="248" height="28" rx="7" fill="#f8fafc"/>
  <rect x="884" y="231" width="248" height="7" fill="#f8fafc"/>
  <text x="896" y="229" fill="#334155" font-family="Arial, sans-serif" font-size="10" font-weight="700">Input JSON</text>
  <rect x="885" y="239" width="27" height="170" fill="#f1f5f9"/>
  <path d="M913 239V410" stroke="#cbd5e1"/>
  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="end"><text x="906" y="258">1</text><text x="906" y="276">2</text><text x="906" y="294">3</text><text x="906" y="312">4</text></g>
  <g fill="#334155" font-family="monospace" font-size="9"><text x="920" y="258">{</text><text x="920" y="276">"name": "GaGet",</text><text x="920" y="294">"ready": true</text><text x="920" y="312">}</text></g>
  <rect x="884" y="424" width="248" height="82" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="896" y="444" fill="#334155" font-family="Arial, sans-serif" font-size="11" font-weight="700">Output</text>
  <text x="896" y="464" fill="#475569" font-family="monospace" font-size="9">{"name":"GaGet",…}</text>
  <text x="884" y="534" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Scrollable menus and source</text>
  <text x="884" y="550" fill="#64748b" font-family="Arial, sans-serif" font-size="10">remain reachable at short height.</text>
  <text x="884" y="582" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Conceptual wireframe · Proposal</text>
</svg>