<text class="muted sm" x="696" y="365">IMAGE</text>
<rect class="surface" x="692" y="374" width="250" height="48" rx="5"/>
<text class="ink txt" x="704" y="393">Crop to fit</text><text class="muted sm" x="704" y="410">Matching description…</text>
<text class="muted sm" x="696" y="454">Preserve feature order and grouping</text>

<!-- no matches -->
<text class="ink sub" x="992" y="112">Mobile · no matches</text>
<rect class="frame" x="992" y="130" width="290" height="420" rx="12"/>
<rect class="surface" x="992" y="130" width="290" height="44" rx="12"/>
<text class="ink txt" x="1008" y="157">☰  File</text><text class="ink txt" x="1196" y="157">Features</text>
<rect class="panel" x="1002" y="183" width="270" height="355" rx="8"/>
<text class="ink txt" x="1016" y="207">All features</text><text class="muted sm" x="1240" y="207">×</text>
<rect class="field" x="1014" y="219" width="246" height="34" rx="5"/>
<text class="muted sm" x="1028" y="240">Search features…  xyz</text>
<text class="ink txt" x="1137" y="348" text-anchor="middle">No matching features</text>
<text class="muted sm" x="1137" y="370" text-anchor="middle">Try a different search</text>

<!-- RTL -->
<text class="ink sub" x="1312" y="112">RTL · Persian/Arabic</text>
<rect class="frame" x="1312" y="130" width="256" height="420" rx="12"/>
<rect class="surface" x="1312" y="130" width="256" height="44" rx="12"/>
<text class="ink txt" x="1328" y="157">☰  پرونده</text><text class="ink txt" x="1474" y="157" text-anchor="end">ویژگی‌ها</text>
<rect class="panel" x="1322" y="183" width="236" height="355" rx="8"/>
<text class="ink txt" x="1540" y="207" text-anchor="end">همه ویژگی‌ها</text><text class="muted sm" x="1334" y="207">×</text>
<rect class="field" x="1334" y="219" width="212" height="34" rx="5"/>
<circle cx="1528" cy="233" r="4.5" fill="none" stroke="#64748b" stroke-width="1.2"/><line x1="1525" y1="236" x2="1521" y2="240" stroke="#64748b" stroke-width="1.2"/>
<text class="muted sm" x="1510" y="240" text-anchor="end">جستجوی ویژگی‌ها…</text>
<text class="ink txt" x="1538" y="287" text-anchor="end">برش</text><text class="ink txt" x="1538" y="319" text-anchor="end">تغییر اندازه</text><text class="ink txt" x="1538" y="351" text-anchor="end">متن و واترمارک</text>
<text class="muted sm" x="1334" y="504">Logical start/end alignment</text>

<!-- Tablet / desktop -->
<text class="ink sub" x="32" y="608">Tablet · 768px and Desktop · 1440px · no new search input</text>
<rect class="frame" x="32" y="628" width="740" height="360" rx="10"/>
<rect class="surface" x="32" y="628" width="740" height="48" rx="10"/>
<text class="ink txt" x="50" y="657">GaGet.dev</text><text class="ink txt" x="570" y="657">File</text><text class="ink txt" x="630" y="657">Features</text>
<rect class="panel" x="52" y="692" width="330" height="275" rx="8"/>
<text class="ink txt" x="70" y="720">Features menu</text>
<text class="ink txt" x="70" y="754">Edit</text><text class="ink txt" x="70" y="784">Image</text><text class="ink txt" x="70" y="814">Create</text>
<text class="muted sm" x="70" y="930">No search input at tablet widths</text>
<rect class="frame" x="812" y="628" width="756" height="360" rx="10"/>
<rect class="surface" x="812" y="628" width="756" height="48" rx="10"/>
<text class="ink txt" x="830" y="657">GaGet.dev</text><text class="ink txt" x="1300" y="657">File</text><text class="ink txt" x="1360" y="657">Edit</text><text class="ink txt" x="1420" y="657">Image</text><text class="ink txt" x="1480" y="657">Create</text>
<rect class="panel" x="832" y="692" width="300" height="275" rx="8"/>
<text class="ink txt" x="850" y="720">Feature group menu</text><text class="ink txt" x="850" y="754">Crop</text><text class="ink txt" x="850" y="784">Resize</text><text class="ink txt" x="850" y="814">Text &amp; watermark</text>
<text class="muted sm" x="850" y="930">Existing desktop behavior unchanged</text>
<text class="muted sm" x="32" y="1030">Contract: mobile = existing XS/SM ranges below 768px. 8 entries → no search; 9+ → search. Proposal, not pixel-perfect and not approved.</text>
</svg>