<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Enhanced mobile Features menu — proposal</title>
<desc id="desc">Editable schematic proposal showing eight-feature mobile menu without search, nine-feature menu with search, matching and no-match results, RTL layout, and tablet/desktop menus without the new search field. Not approved or pixel-perfect.</desc>
<defs><style>
.board{fill:#f3f5f8}.frame{fill:#fff;stroke:#94a3b8;stroke-width:2}.surface{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}.panel{fill:#eef2ff;stroke:#818cf8;stroke-width:1.4}.field{fill:#fff;stroke:#94a3b8;stroke-width:1.2}.line{stroke:#cbd5e1;stroke-width:1}.ink{fill:#111827;font-family:Arial,sans-serif}.muted{fill:#64748b;font-family:Arial,sans-serif}.h{font-size:25px;font-weight:700}.sub{font-size:17px;font-weight:700}.txt{font-size:13px}.sm{font-size:11px}.tag{fill:#dbeafe;stroke:#60a5fa;stroke-width:1}.warn{fill:#fff7ed;stroke:#fdba74;stroke-width:1}
</style></defs>
<rect class="board" width="1600" height="1080"/>
<text class="ink h" x="32" y="42">Enhanced Mobile Features Menu — Target Proposal</text>
<text class="muted txt" x="32" y="68">Editable schematic · Proposal only · Search appears below 768px only when feature count exceeds 8</text>

<!-- 8 items -->
<text class="ink sub" x="32" y="112">Mobile · exactly 8 features · no search</text>
<rect class="frame" x="32" y="130" width="290" height="420" rx="12"/>
<rect class="surface" x="32" y="130" width="290" height="44" rx="12"/>
<text class="ink txt" x="48" y="157">☰  File</text><text class="ink txt" x="236" y="157">Features</text>
<rect class="panel" x="42" y="183" width="270" height="355" rx="8"/>
<text class="ink txt" x="56" y="207">All features</text><text class="muted sm" x="280" y="207">×</text>
<line class="line" x1="50" y1="220" x2="304" y2="220"/>
<g class="ink txt"><text x="58" y="244">Crop</text><text x="58" y="277">Resize</text><text x="58" y="310">Text &amp; watermark</text><text x="58" y="343">Color &amp; filters</text><text x="58" y="376">Color picker</text><text x="58" y="409">Image details</text><text x="58" y="442">Export &amp; convert</text><text x="58" y="475">Print size</text></g>
<text class="muted sm" x="48" y="520">8 entries; no search row</text>

<!-- 9 items -->
<text class="ink sub" x="352" y="112">Mobile · exactly 9 features · search shown</text>
<rect class="frame" x="352" y="130" width="290" height="420" rx="12"/>
<rect class="surface" x="352" y="130" width="290" height="44" rx="12"/>
<text class="ink txt" x="368" y="157">☰  File</text><text class="ink txt" x="556" y="157">Features</text>
<rect class="panel" x="362" y="183" width="270" height="355" rx="8"/>
<text class="ink txt" x="376" y="207">All features</text><text class="muted sm" x="600" y="207">×</text>
<rect class="field" x="374" y="219" width="246" height="34" rx="5"/>
<circle cx="388" cy="233" r="4.5" fill="none" stroke="#64748b" stroke-width="1.2"/><line x1="391" y1="236" x2="395" y2="240" stroke="#64748b" stroke-width="1.2"/>
<text class="muted sm" x="402" y="240">Search features…</text>
<line class="line" x1="370" y1="264" x2="624" y2="264"/>
<g class="ink txt"><text x="378" y="287">Crop</text><text x="378" y="316">Resize</text><text x="378" y="345">Text &amp; watermark</text><text x="378" y="374">Color &amp; filters</text><text x="378" y="403">Color picker</text><text x="378" y="432">Image details</text><text x="378" y="461">Export &amp; convert</text><text x="378" y="490">Print size</text><text x="378" y="519">Image to Base64</text></g>

<!-- matching -->
<text class="ink sub" x="672" y="112">Mobile · matching results</text>
<rect class="frame" x="672" y="130" width="290" height="420" rx="12"/>
<rect class="surface" x="672" y="130" width="290" height="44" rx="12"/>
<text class="ink txt" x="688" y="157">☰  File</text><text class="ink txt" x="876" y="157">Features</text>
<rect class="panel" x="682" y="183" width="270" height="355" rx="8"/>
<text class="ink txt" x="696" y="207">All features</text><text class="muted sm" x="920" y="207">×</text>
<rect class="field" x="694" y="219" width="246" height="34" rx="5"/>
