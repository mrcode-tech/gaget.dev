name: Render editor file-state wireframes

on:
  push:
    branches:
      - proposal/unified-editor-file-states
    paths:
      - 'specification/editor-file-states/wireframes/*.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-jpeg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@v4
        with:
          ref: proposal/unified-editor-file-states
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Render SVG wireframes to JPEG
        run: |
          set -euo pipefail
          shopt -s nullglob
          for source in specification/editor-file-states/wireframes/*.svg; do
            target="${source%.svg}.jpg"
            convert -background white -density 160 "$source" -alpha remove -alpha off -quality 92 "$target"
            identify "$target"
          done
      - name: Commit rendered JPEGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specification/editor-file-states/wireframes/*.jpg
          if git diff --cached --quiet; then
            echo "No JPEG changes to commit."
            exit 0
          fi
          git commit -m "Add JPEG exports of editor file-state wireframes"
          git push origin HEAD:proposal/unified-editor-file-states
