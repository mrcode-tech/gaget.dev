name: Mobile Photo Editor CI

on:
  # Trigger one full validation run for the completed regression-fix batch on this feature branch.
  push:
    branches:
      - feat/mobile-photo-editor-ux-fixes

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, component tests, lint, typecheck, build, smoke, and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install is used because the current lockfile is stale and omits dependencies.
        # Once package-lock.json is regenerated and committed, switch this to npm ci.
        run: npm install --no-audit --no-fund

      - name: Install Chromium for responsive and accessibility tests
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Run focused Photo Editor and sidebar regression tests
        run: npx vitest run tests/photo-editor.test.tsx tests/app-sidebar.test.tsx

      - name: Run component tests
        run: npm run test:component

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production app
        run: npm run build

      - name: Start production server, smoke-test routes, and run responsive accessibility tests
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 > /tmp/gaget-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat /tmp/gaget-next.log
            exit 1
          fi

          SMOKE_BASE_URL=http://127.0.0.1:3000 node --test tests/smoke.test.mjs
          npm run test:e2e
