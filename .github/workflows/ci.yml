name: CI

on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The repository lockfile currently omits @radix-ui/react-select and its transitive dependencies.
        # npm install refreshes that stale lockfile in the runner; commit the regenerated lockfile separately.
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

      - name: Run component tests
        run: npm run test:component

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production app
        run: npm run build

      - name: Start production server and smoke-test routes
        shell: bash
        run: |
          npm run start > /tmp/gaget-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat /tmp/gaget-next.log
            exit 1
          fi

          SMOKE_BASE_URL=http://127.0.0.1:3000 node --test tests/smoke.test.mjs
