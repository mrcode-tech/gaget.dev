name: GaGet.dev CI

on:
  # Run the complete quality gate on every branch and commit.
  push:
    branches:
      - "**"
  # Validate all proposed changes before they can be merged.
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# Allow only one active run of this workflow across the entire repository.
# A newly queued run cancels the previous in-progress run, regardless of branch
# or trigger (push, pull_request, or workflow_dispatch).
concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, component tests, lint, typecheck, build, smoke, and accessibility tests
    runs-on: ubuntu-latest
    # Includes the expanded route/theme/viewport/RTL screenshot matrix.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install-dependencies
        # npm install is used because the current lockfile is stale and omits dependencies.
        # Once package-lock.json is regenerated and committed, switch this to npm ci.
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee artifacts/ci-logs/dependency-install.log

      # Cache browser binaries between runs. The key changes when the lockfile
      # changes, so a Playwright version update cannot reuse an incompatible browser.
      - name: Cache Playwright browsers
        id: playwright-browser-cache
        if: always() && steps.install-dependencies.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium system dependencies
        id: install-chromium-deps
        if: always() && steps.install-dependencies.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npx playwright install-deps chromium 2>&1 | tee artifacts/ci-logs/browser-dependencies.log

      - name: Install Chromium browser
        id: install-chromium
        if: always() && steps.install-dependencies.outcome == 'success' && steps.playwright-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npx playwright install chromium 2>&1 | tee artifacts/ci-logs/browser-install.log

      - name: Run unit tests
        id: unit-tests
        if: always() && steps.install-dependencies.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run test:unit 2>&1 | tee artifacts/ci-logs/unit-tests.log

      - name: Run focused Photo Editor and sidebar regression tests
        id: focused-regressions
        if: always() && steps.install-dependencies.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npx vitest run tests/photo-editor.test.tsx tests/app-sidebar.test.tsx 2>&1 | tee artifacts/ci-logs/focused-regressions.log

      - name: Run component tests
        id: component-tests
        if: always() && steps.install-dependencies.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run test:component 2>&1 | tee artifacts/ci-logs/component-tests.log

      - name: Run ESLint
        id: lint
        if: always() && steps.install-dependencies.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/ci-logs/lint.log

      - name: Check TypeScript
        id: typecheck
        if: always() && steps.install-dependencies.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/ci-logs/typecheck.log

      - name: Build production app
        id: build
        if: always() && steps.install-dependencies.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run build 2>&1 | tee artifacts/ci-logs/build.log

      - name: Start production server, smoke-test routes, and run responsive accessibility tests
        id: browser-validation
        if: always() && steps.install-dependencies.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-logs
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 > /tmp/gaget-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cp /tmp/gaget-next.log artifacts/ci-logs/next-startup.log
            cat /tmp/gaget-next.log
            echo "browser-validation=server-start-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          validation_status=0
          if SMOKE_BASE_URL=http://127.0.0.1:3000 node --test tests/smoke.test.mjs 2>&1 | tee artifacts/ci-logs/smoke-tests.log; then
            smoke_status=passed
          else
            smoke_status=failed
            validation_status=1
          fi
          echo "smoke-tests=$smoke_status" >> "$GITHUB_OUTPUT"

          if npm run test:e2e 2>&1 | tee artifacts/ci-logs/e2e-tests.log; then
            e2e_status=passed
          else
            e2e_status=failed
            validation_status=1
          fi
          echo "e2e-tests=$e2e_status" >> "$GITHUB_OUTPUT"

          if DESIGN_BASELINE_URL=http://127.0.0.1:3000 \
            DESIGN_BASELINE_OUTPUT=artifacts/design-baseline \
            DESIGN_BASELINE_COMMIT="${GITHUB_SHA}" \
            node scripts/capture-design-baseline.mjs 2>&1 | tee artifacts/ci-logs/design-baseline.log; then
            baseline_status=passed
          else
            baseline_status=failed
            validation_status=1
          fi
          echo "design-baseline=$baseline_status" >> "$GITHUB_OUTPUT"
          echo "browser-validation=$([ "$validation_status" -eq 0 ] && echo passed || echo failed)" >> "$GITHUB_OUTPUT"
          exit "$validation_status"

      - name: Collect production server log
        if: always()
        run: |
          mkdir -p artifacts/ci-logs
          if [ -f /tmp/gaget-next.log ]; then cp /tmp/gaget-next.log artifacts/ci-logs/next.log; fi

      - name: Generate CI evidence manifest
        if: always()
        env:
          CI_DEPENDENCY_INSTALL: ${{ steps.install-dependencies.outcome }}
          CI_BROWSER_INSTALL: ${{ steps.install-chromium.outcome }}
          CI_BROWSER_DEPENDENCIES: ${{ steps.install-chromium-deps.outcome }}
          CI_BROWSER_CACHE_HIT: ${{ steps.playwright-browser-cache.outputs.cache-hit }}
          CI_UNIT_TESTS: ${{ steps.unit-tests.outcome }}
          CI_FOCUSED_REGRESSIONS: ${{ steps.focused-regressions.outcome }}
          CI_COMPONENT_TESTS: ${{ steps.component-tests.outcome }}
          CI_LINT: ${{ steps.lint.outcome }}
          CI_TYPECHECK: ${{ steps.typecheck.outcome }}
          CI_BUILD: ${{ steps.build.outcome }}
          CI_BROWSER_VALIDATION: ${{ steps.browser-validation.outcome }}
          CI_SMOKE_TESTS: ${{ steps.browser-validation.outputs.smoke-tests }}
          CI_E2E_TESTS: ${{ steps.browser-validation.outputs.e2e-tests }}
          CI_DESIGN_BASELINE: ${{ steps.browser-validation.outputs.design-baseline }}
          CI_JOB_STATUS: ${{ job.status }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_WORKFLOW: ${{ github.workflow }}
          CI_REPOSITORY: ${{ github.repository }}
        run: node scripts/write-ci-evidence-manifest.mjs

      - name: Upload test and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/design-baseline/
            artifacts/ci-logs/
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 30
