name: Render audio editor wireframes

on:
  push:
    branches:
      - proposal/unified-audio-editor
    paths:
      - 'specification/audio-editor/wireframes/*.svg'
      - '.github/workflows/render-audio-wireframes.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@v4
        with:
          ref: proposal/unified-audio-editor
          fetch-depth: 0

      - name: Install SVG rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Render PNG and JPEG variants
        run: |
          set -euo pipefail
          cd specification/audio-editor/wireframes
          for svg in *.svg; do
            name="${svg%.svg}"
            rsvg-convert --format=png --output="${name}.png" "$svg"
            magick "${name}.png" -quality 88 "${name}.jpg"
          done

      - name: Commit generated wireframes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specification/audio-editor/wireframes/*.png specification/audio-editor/wireframes/*.jpg
          if git diff --cached --quiet; then
            echo "Wireframe images are already up to date."
            exit 0
          fi
          git commit -m "docs: add PNG and JPEG audio wireframes"
          git push origin HEAD:proposal/unified-audio-editor
