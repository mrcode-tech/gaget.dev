name: Render design-system wireframes

on:
  push:
    branches:
      - feature/design-system-token-handoff
    paths:
      - "specification/design-system/wireframes/*.svg"
      - ".github/workflows/render-design-system-wireframes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-design-system-wireframes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-png:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/design-system-token-handoff
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render SVG wireframes to PNG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(specification/design-system/wireframes/*.svg)
          if (( ${#sources[@]} == 0 )); then
            echo "No SVG wireframes found." >&2
            exit 1
          fi
          for source in "${sources[@]}"; do
            target="${source%.svg}.png"
            rsvg-convert --width 1440 --keep-aspect-ratio --output "$target" "$source"
            test -s "$target"
            file "$target"
          done

      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specification/design-system/wireframes/*.png
          if git diff --cached --quiet; then
            echo "PNG exports are already up to date."
            exit 0
          fi
          git commit -m "docs: render design-system wireframes as PNG"
          git push origin HEAD:feature/design-system-token-handoff
